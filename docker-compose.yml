services:
  backend:
    # Which backend implementation to run: a folder under ./backend (default: nodejs)
    build: ./backend/${BACKEND:-nodejs}
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      SEED_PRODUCTS_FILE: /seed/products.json
      CURRENCY: ${CURRENCY:-GBP}
      # Origin(s) of the frontend, as the *browser* sees it (used for CORS).
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
      # OpenTelemetry - standard OTEL_* variables.
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-coffee-cart-backend}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4318}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment=local}
    extra_hosts:
      # Lets the container reach an LGTM stack published on the host (needed on Linux).
      - "host.docker.internal:host-gateway"
    volumes:
      # The menu is shared by every backend implementation.
      - ./backend/seed-products.json:/seed/products.json:ro

  frontend:
    build: ./frontend
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      # Both URLs are used by the BROWSER, so they must be reachable from the host.
      API_URL: ${API_URL:-http://localhost:3000}
      FARO_URL: ${FARO_URL-http://localhost:12347/collect}
      FARO_APP_NAME: ${FARO_APP_NAME:-coffee-cart-frontend}
      FARO_APP_VERSION: ${FARO_APP_VERSION:-1.0.0}
      FARO_APP_ENV: ${FARO_APP_ENV:-local}
    depends_on:
      - backend
